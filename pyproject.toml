[project]
name = "scrap-monitoring-lidar-simulator"
version = "1.0.1"
description = "Contract and documentation tooling for the Rust LiDAR simulator."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0,<5",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<0.17",
    "rumdl>=0.2.70,<0.3",
    "types-jsonschema>=4.26.0.20260518,<5",
    "types-grpcio>=1.83.0.20260730,<1.84",
]
integration = [
    "grpcio>=1.83.1,<1.84",
    "numpy>=2.5.3,<2.6",
    "protobuf>=7.36.1,<8",
]
docs = [
    "pillow==12.3.0",
    "python-docx==1.2.0",
]
[tool.uv]
package = false
required-version = "==0.12.15"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.rumdl]
disable = ["MD013"]
exclude = ["docs/internal/**"]
respect-gitignore = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tests", "tools", "docs/synthetic-environment-specification/generate.py"]
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
